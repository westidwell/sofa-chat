# XcodeGen spec for the tvOS app. Run `xcodegen generate` in this folder to
# create SofaChat.xcodeproj, then open it in Xcode.
name: SofaChat

options:
  # Change this to your own reverse-domain prefix before running on a device.
  bundleIdPrefix: com.example
  deploymentTarget:
    tvOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  SofaChatCore:
    path: SofaChatCore

targets:
  SofaChat:
    type: application
    platform: tvOS
    sources:
      - path: App
    dependencies:
      - package: SofaChatCore
    scheme: {}
    settings:
      base:
        PRODUCT_NAME: SofaChat
        PRODUCT_BUNDLE_IDENTIFIER: com.example.sofachat
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sofa Chat
        # App icon and Top Shelf images live in App/Assets.xcassets.
        # Redraw them with: python3 Design/make_artwork.py
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        ASSETCATALOG_COMPILER_LAUNCHIMAGE_NAME: ""
        CODE_SIGN_STYLE: Automatic
        # Set your team in Xcode (Signing & Capabilities) to run on a real Apple TV.
        DEVELOPMENT_TEAM: ""
